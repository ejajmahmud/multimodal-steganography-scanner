[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-steganography-scanner"
version = "0.1.0"
description = "Spatial and frequency-domain image analyzer detecting hidden adversarial perturbation prompts injected into input images"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
multimodal-steganography-scanner = "multimodal_steganography_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["multimodal_steganography_scanner*"]
